<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Reference Engineering Prompt</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
            background-color: white;
        }

        table {
            border-collapse: collapse;
            font-size: 14px;
            color: #000;
        }

        /* Table header styling */
        th {
            background-color: #e0e0e0;
            color: #b00;
            font-weight: bold;
            padding: 5px 10px;
            text-align: right;
            border: 1px solid #ccc;
        }

        th:first-child {
            text-align: left;
            background-color: #e0e0e0;
            color: #000;
        }

        tfoot th {
            border-top: 2px solid #000;
        }

        /* Table data cells */
        td {
            padding: 5px 10px;
            text-align: right;
            border: 1px solid #e0e0e0;
        }

        td:first-child {
            text-align: left;
            font-weight: normal;
            color: #000;
            background-color: #fff;
        }

        tr:hover td {
            background-color: #f5f5f5;
        }

        .dash {
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="table-container">Loading data...</div>

    <script>
        async function loadAndBuildTable() {
            try {
                // Fetch and parse data
                const response = await fetch('data.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                const teams = Object.keys(data).sort();
                const table = document.createElement("table");

                // Build table header
                const thead = document.createElement("thead");
                const headerRow = document.createElement("tr");
                
                // "Tm" corner cell
                const thCorner = document.createElement("th");
                thCorner.innerText = "Tm";
                headerRow.appendChild(thCorner);

                // Team Header Columns
                teams.forEach(team => {
                    const th = document.createElement("th");
                    th.innerText = team;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                // Build table body with win data
                const tbody = document.createElement("tbody");
                
                teams.forEach(rowTeam => {
                    const tr = document.createElement("tr");

                    const tdName = document.createElement("td");
                    tdName.innerText = rowTeam;
                    tr.appendChild(tdName);

                    teams.forEach(colTeam => {
                        const td = document.createElement("td");
                        
                        if (rowTeam === colTeam) {
                            td.innerText = "--";
                            td.classList.add("dash");
                        } else {
                            const matchup = data[rowTeam] && data[rowTeam][colTeam];
                            td.innerText = matchup ? matchup.W : "0";
                        }
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);

                // Add footer
                const tfoot = document.createElement("tfoot");
                const footerRow = headerRow.cloneNode(true);
                tfoot.appendChild(footerRow);
                table.appendChild(tfoot);

                // Render table to page
                const container = document.getElementById("table-container");
                container.innerHTML = "";
                container.appendChild(table);

            } catch (error) {
                console.error("Error loading table:", error);
                document.getElementById("table-container").innerText = "Error loading data.json. Ensure you're using a live server.";
            }
        }

        loadAndBuildTable();
    </script>
</body>
</html>
