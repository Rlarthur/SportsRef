<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Reference Engineering Prompt</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
            background-color: white;
        }

        table {
            border-collapse: collapse;
            font-size: 14px;
            color: #000;
        }

        /* Header and Footer Styling */
        th {
            background-color: #e0e0e0; /* Light grey background for headers */
            color: #b00; /* Dark Red text for headers */
            font-weight: bold;
            padding: 5px 10px;
            text-align: right; /* Default align right for stats */
            border: 1px solid #ccc;
        }

        /* The first column header "Tm" should be left aligned */
        th:first-child {
            text-align: left;
            background-color: #e0e0e0;
            color: #000; /* "Tm" is usually black or dark */
        }

        /* Footer specific styling (tfoot) to match the header look */
        tfoot th {
            border-top: 2px solid #000; /* Thicker line separating footer */
        }

        /* Data Cell Styling */
        td {
            padding: 5px 10px;
            text-align: right;
            border: 1px solid #e0e0e0; /* Faint grid lines */
        }

        /* First Column (Team Names) Styling */
        td:first-child {
            text-align: left;
            font-weight: normal;
            color: #000;
            background-color: #fff;
        }

        /* Hover effect for better readability */
        tr:hover td {
            background-color: #f5f5f5;
        }

        /* The diagonal "--" styling */
        .dash {
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="table-container">Loading data...</div>

    <script>
        async function loadAndBuildTable() {
            try {
                // 1. Fetch the local JSON file
                const response = await fetch('data.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // The data is an object where keys are teams: { "BRO": { ... }, "BSN": { ... } }
                const data = await response.json();

                // 2. Extract Team List (Sorted Alphabetically)
                const teams = Object.keys(data).sort();

                // 3. Create Table Element
                const table = document.createElement("table");

                // --- HEADER ---
                const thead = document.createElement("thead");
                const headerRow = document.createElement("tr");
                
                // "Tm" corner cell
                const thCorner = document.createElement("th");
                thCorner.innerText = "Tm";
                headerRow.appendChild(thCorner);

                // Team Header Columns
                teams.forEach(team => {
                    const th = document.createElement("th");
                    th.innerText = team;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                // --- BODY ---
                const tbody = document.createElement("tbody");
                
                teams.forEach(rowTeam => {
                    const tr = document.createElement("tr");

                    // First Column: Team Name
                    const tdName = document.createElement("td");
                    tdName.innerText = rowTeam;
                    tr.appendChild(tdName);

                    // Data Columns
                    teams.forEach(colTeam => {
                        const td = document.createElement("td");
                        
                        if (rowTeam === colTeam) {
                            // Diagonal cell (Team vs Themselves)
                            td.innerText = "--";
                            td.classList.add("dash");
                        } else {
                            // Lookup logic for your specific JSON structure:
                            // data["BRO"]["BSN"] -> { 'W': 10, 'L': 12 }
                            
                            // Check if the opponent exists in the record
                            const matchup = data[rowTeam] && data[rowTeam][colTeam];
                            
                            if (matchup) {
                                td.innerText = matchup.W; // Display only Wins
                            } else {
                                td.innerText = "0"; // Default to 0 if no record found
                            }
                        }
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);

                // --- FOOTER (Matches Header) ---
                const tfoot = document.createElement("tfoot");
                const footerRow = headerRow.cloneNode(true);
                tfoot.appendChild(footerRow);
                table.appendChild(tfoot);

                // 4. Clear loading text and append table
                const container = document.getElementById("table-container");
                container.innerHTML = "";
                container.appendChild(table);

            } catch (error) {
                console.error("Error loading table:", error);
                document.getElementById("table-container").innerText = "Error loading data.json. Make sure you are running this on a Live Server and your JSON is valid (use double quotes!).";
            }
        }

        // Run the function
        loadAndBuildTable();
    </script>
</body>
</html>
